# =============================================================================
# Caso de validación: pasteurizador de yema de Gut et al. (2003) [gut2003yolk]
#
# Se reproduce la columna "pure countercurrent flow model" de su Tabla 7:
# U constante por sección y ε-NTU en contracorriente pura. Es exactamente el
# modelo de v0, así que la comparación valida el encadenamiento de secciones,
# los balances y las propiedades, no las correlaciones de h (eso es v1).
# =============================================================================

producto:
  caudal_L_h: 230
  T_entrada_C: 5
  termicas: gut2003_yema               # ecs. 1–3 de Gut, como en el paper

agua_caliente: {caudal_kg_s: 0.15, T_entrada_C: 66}
agua_fria:     {caudal_kg_s: 0.15, T_entrada_C: 2}

placa:
  largo_m: 0.330
  ancho_m: 0.090
  factor_area: 1.0                     # placas lisas (Sharifi et al., 1995)

canales:                               # NC por sección; área = (NC − 1) × área de placa
  regeneracion: 32
  calentamiento: 13
  enfriamiento: 13

U_W_m2K:
  regeneracion: 756
  calentamiento: 864
  enfriamiento: 1195

holding:
  perdida_T_C: 1.0

# Resultados publicados (Tabla 7, contracorriente pura). Numeración del paper:
#
#   T1 yema cruda (5 °C)
#    ▼
#   [regeneración, lado frío] ─T2─► [calentamiento] ─T3─► tubo ─T4─┐
#   T6 ◄─ [enfriamiento] ◄─T5─ [regeneración, lado caliente] ◄─────┘
esperado_C:
  T2: 48.34                            # yema cruda a la salida de la regeneración (entra al calentamiento)
  T3: 61.26                            # yema a la salida del calentamiento (entra al tubo)
  T4: 60.26                            # yema a la salida del tubo de retención (punto legal)
  T5: 17.38                            # yema pasteurizada a la salida de la regeneración (entra al enfriamiento)
  T6: 4.45                             # yema a la salida del enfriamiento (a almacenamiento)

tolerancia_C: 0.5
