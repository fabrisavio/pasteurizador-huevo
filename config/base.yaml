# =============================================================================
# Configuración base del pasteurizador (v1.1: U por correlación de placa, tubo en horquillas)
#
# Unidades prácticas acá (kg/h, °C, min, bar). El código pasa todo a SI al
# cargar, salvo las temperaturas, que quedan en °C porque así están escritas
# todas las correlaciones de propiedades. Las diferencias de T valen igual en K.
#
# Entre corchetes, la clave de la fuente en docs/fuentes.bib.
#
# Para probar otro caso: copiá este archivo (por ejemplo a config/mi_caso.yaml),
# cambiá lo que quieras y corré  python correr.py config/mi_caso.yaml
# YAML: la sangría (espacios, no tabs) define qué está adentro de qué.
# =============================================================================

productos:

  HP:                                   # huevo entero
    nombre: Huevo entero
    caudal_kg_h: 798                    # balance de masa del grupo (RESUMEN.xlsx)
    T_entrada_C: 10                     # diseño; rango de operación 10–25 °C
    T_entrada_rango_C: [10, 25]
    pH: 7.6                             # informativo [cunningham1995pasteurization], p. 292
    T_holding_C: 60.0                   # safe harbor [fsis2026guideline], [rbn1994cap15]
    t_holding_min: 3.5
    T_salida_C: 45                      # salida al secador; más frío se acepta (31/10)
    T_max_agua_C: 63                    # tope de T de pared en calentamiento
    T_espesa_C: 56                      # empieza a subir la viscosidad; coagula a ~73 °C [froning2002manual], p. 3
    composicion:                        # fracción másica; balance del grupo, Tabla 2
      agua: 0.7651
      proteina: 0.126
      grasa: 0.100
      carbohidratos: 0.003
      cenizas: 0.0059
    termicas: choi_okos                 # [choi1986thermal]
    reologia: leon_munguia_huevo_entero # [leonmunguia_tesis]
    cinetica: {D_ref_min: 1.25, T_ref_C: 60.0, z_C: 4.84}   # derivado de [fsis2026guideline], Ap. III
    horas_anio: 2496

  YP:                                   # yema
    nombre: Yema
    caudal_kg_h: 1083
    T_entrada_C: 7                      # tanque a 7 °C [fsis2026guideline]
    T_entrada_rango_C: [7, 7.2]
    pH: 6.2                             # informativo [cunningham1995pasteurization], p. 292
    T_holding_C: 61.1                   # safe harbor [fsis2026guideline]
    t_holding_min: 3.5
    T_salida_C: 45
    T_max_agua_C: 64
    T_espesa_C: 65                      # la viscosidad empieza a subir a 65 °C [froning2002manual], p. 3
    composicion:                        # yema comercial, USDA vía [froning2002manual], Tabla 1
      agua: 0.562
      proteina: 0.155
      grasa: 0.256
      carbohidratos: 0.0115
      cenizas: 0.0155
    termicas: choi_okos                 # alternativa: gut2003_yema (medidas; cp ~17 % menor)
    reologia: gut2003_yema              # tablas 4 y 5 de [gut2003yolk]
    reologia_gamma_1_s: [70.2, 512.4]   # rango de corte de esas tablas: aviso si las placas se salen
    cinetica: {D_ref_min: 1.68, T_ref_C: 61.1, z_C: 7.31}   # derivado de [fsis2026guideline], Ap. III
    horas_anio: 168

  CP:                                   # clara concentrada por UF (23 % de sólidos)
    nombre: Clara concentrada
    caudal_kg_h: 822.4
    T_entrada_C: 35                     # salida de la UF (dato SANOVO)
    T_entrada_rango_C: [35, 35]
    # Ruta de la clara (decisión del 08/11, ver docs/justificacion_clara.tex):
    # el desazucarado la deja a pH 7 (patente); al terminar, en el mismo tanque,
    # se sube a pH 9,3 con NaOH diluida (~240 eq por lote de 14 t). A pH 9,3 la
    # Salmonella resiste menos el calor y la conalbúmina es estable, así que
    # alcanza con 56,7 °C. Se aparta del RBN 15.2.11 (60 °C × 3,5 min) y de su
    # lista de aditivos (la soda no figura para huevo): desvíos declarados.
    pH: 9.3
    T_holding_C: 56.7                   # [fsis2026guideline], Ap. III, Tabla III.A, pH 9,3 (5,7 log)
    t_holding_min: 4.96                 # misma tabla; [froning2002manual], Tabla 29, da 4,3 min para 5 log
    T_salida_C: 45
    # A pH ~9 la clara admite calentarse hasta 59 °C sin problemas en un
    # intercambiador de placas; a 60 °C aparecen cambios que traban el equipo
    # [cunningham1995pasteurization], p. 296.
    T_max_agua_C: 59
    # Empieza a espesar entre 56,7 y 57,2 °C a pH 9 [cunningham1995pasteurization], pp. 290–291.
    # En equipos comerciales: 57 °C × 4 min y 58 °C × 7,5 min sin cambio de viscosidad (p. 296–297).
    T_espesa_C: 56.7
    composicion:
      agua: 0.77
      proteina: 0.203
      grasa: 0.0006
      carbohidratos: 0.0148
      cenizas: 0.0116
    termicas: choi_okos
    reologia: clara_uf_thapon_scalzo    # 9,3 mPa·s a 30 °C [thapon1981]; forma μ(T) de [scalzo1970viscosity]
    # D y z a pH 9,3: ajuste log-lineal de la Tabla III.A de [fsis2026guideline]
    # (54,4–58,9 °C, D = t/5,7; residuo máximo 0,011 log). Mismo método que HP y YP.
    cinetica: {D_ref_min: 0.854, T_ref_C: 56.7, z_C: 4.17}
    horas_anio: 216

equipo:
  placa:                                # placa chevron "típica", dentro de rangos de libro: no es de catálogo
    area_m2: 0.15                       # área de transferencia por placa [shah2003fundamentals], [kakac2012heat]
    ancho_m: 0.20                       # ancho del canal
    separacion_b_m: 0.003               # profundidad del corrugado (b)
    angulo_chevron_grados: 45           # a 45° coinciden las dos convenciones de ángulo de la literatura
    factor_area: 1.17                   # área desarrollada / proyectada (φ)
    espesor_m: 0.0005
    k_W_mK: 16.3                        # AISI 316L
    diam_puerto_m: 0.05                 # supuesto (DN50); el Δp de puertos casi no pesa

  # Solo para el plano. El bastidor depende del proveedor: se toma uno comercial con
  # la misma placa (canal libre 3 mm, conexiones DN50) como referencia [alfalavalm6].
  bastidor:
    alto_m: 0.92
    ancho_m: 0.32
    largo_rango_m: [0.515, 1.43]        # según el largo de bastidor que se compre
    conector_m: 0.10                    # bastidor intermedio entre las dos secciones (supuesto)
    placas_extremo_por_seccion: 2       # placa de principio y de fin de cada sección (supuesto)

  # Cómo se calcula U:
  #   correlacion (v1): 1/U = 1/h_caliente + 1/h_fría + e/k + ensuciamiento, cada h por correlación
  #   fijo (v0): los valores de U_fijo_W_m2K. Para volver a v0.5 alcanza con  modelo_U: fijo
  modelo_U: correlacion
  correlacion: kumar                    # [kumar1984phe] vía [kakac2012heat]; constantes por ángulo y Re
  correlacion_contraste: martin         # [martin1996chevron]: solo se informa, no diseña
  U_fijo_W_m2K:                         # v0: caso de yema de [gut2003yolk], Tabla 7 (contracorriente pura)
    regeneracion: 756
    calentamiento: 864

  # Ensuciamiento por lado [m²·K/W]. Producto: los de leche de [lalande1979fouling] que usan
  # [gut2003yolk] para la yema; agua caliente: [marriott1971phe], también vía [gut2003yolk].
  # Es la decisión que más mueve el área: sin ensuciamiento el equipo pasa de 62 a 34 placas.
  ensuciamiento_m2K_W:
    producto_regeneracion: 3.0e-4       # cada lado: en la regeneración hay producto de los dos lados
    producto_calentamiento: 9.0e-4
    agua_caliente: 3.4e-5

  # Arreglo de cada sección: pasos en serie × canales por paso, igual de los dos lados
  # (pasos en contracorriente: se trata como contracorriente pura, como en v0).
  # El modelo prueba cada número de pasos y se queda con el de menos placas que cumple el Δp.
  arreglo:
    pasos_candidatos: [1, 2, 3, 4, 5, 6, 8]
    dp_max_seccion_bar: 1.0             # por sección y por corriente (supuesto, mismo criterio que el tubo)

  cip:
    # [galinski2025cip]: en su PHE el caudal mínimo efectivo fue 1200 L/h, que según su ec. 6
    # (Re = V·De·ρ/(N·b·w·η), De = 2b) es Re ≈ 2150. Se traslada el Re, no los L/h.
    Re_min_placas: 2150
    T_C: 70                             # solución alcalina caliente (supuesto)

  holding:
    DN_diam_int_m: {25: 0.026, 32: 0.032, 40: 0.038, 50: 0.050, 65: 0.066}   # [din11850], serie 2
    DN_diam_ext_m: {25: 0.029, 32: 0.035, 40: 0.041, 50: 0.053, 65: 0.070}
    geometria:
      # horquillas | espiral | recto. Horquillas (decisión de los tutores, 10/11): tramos
      # rectos unidos por curvas de 180°, en dos planos, subiendo siempre.
      tipo: horquillas
      largo_tramo_max_m: 6.0            # los tubos DIN 11850 vienen de ~6 m [alfalavaldin]
      # Curvas DIN 11852, radio al eje por DN [alfalavaldin], p. 1.5.35
      radio_curva_m: {25: 0.050, 32: 0.055, 40: 0.060, 50: 0.070, 65: 0.080}
      luz_entre_tubos_m: 0.02           # entre tubos vecinos ya aislados (supuesto)
      # Subida continua de al menos 2 %, curvas incluidas, desde el punto más bajo
      # hasta la válvula de desvío [cfia2026htst]. Fija el desnivel: 2 % del largo.
      pendiente_min: 0.02
      # Curvas de 180° de radio largo, método 2-K: K = K1/Re + K∞·(1 + 1/D[pulg]) [hooper1981twok]
      K1_curva: 1000
      Kinf_curva: 0.30
      # --- solo espiral (la geometría de v1.0, queda para comparar) ---
      diam_espiral_m: 1.0               # diámetro de la hélice, al eje del tubo (supuesto)
      separacion_vueltas_m: 0.01        # luz entre vueltas
      # Solo espiral. Partícula más rápida en la hélice, como fracción del tiempo medio.
      # Recto laminar newtoniano: 0,5. Hélice: 0,586–0,658 en el análisis de
      # flujo laminar ideal [ruthven1971helical], [trivedi1974rtd], según
      # [gutierrez2010holding], que midieron ≥ 0,70 en un tubo helicoidal real.
      # Se toma el extremo bajo (el conservador): v_max/v_media = 1/0,586 = 1,71.
      # Es un valor newtoniano; se aplica también a yema y huevo entero, cuyo
      # perfil ya es más plano que la parábola.
      t_min_sobre_t_medio: 0.586
      Dean_min: 11.6                    # solo espiral: debajo de esto no hay vórtices de Dean [white1929curved]
    # La pérdida de T en el tubo se calcula con la aislación (antes era 0,5 °C fijo).
    # Para volver a un valor fijo: borrar 'aislacion' y poner  perdida_T_C: 0.5
    aislacion:
      # tubo: coquilla a lo largo (decisión de los tutores, 10/11) | bloque: solo con espiral
      forma: tubo
      curvas_aisladas: true             # también las curvas, con tapas desmontables (decisión del 10/11)
      espesor_m: 0.05
      k_W_mK: 0.040                     # lana mineral; mantas de fibra 0,038–0,046 [incropera2007fundamentals], Tabla A.3
      h_ext_W_m2K: 10                   # convección natural + radiación (supuesto; casi no influye)
      h_desnudo_W_m2K: 10               # caño de acero pelado a ~60 °C en aire quieto (supuesto)
      union_sin_aislar_m: 0.05          # a cada lado de una curva: abrazadera sin coquilla (supuesto)
      T_ambiente_C: 20                  # sala de proceso (supuesto)
      holgura_m: 0.05                   # solo bloque: luz entre la espiral y la camisa
      # La aislación del tubo de retención tiene que poder sacarse para inspeccionarlo [cfia2026htst]
    dp_max_bar: 1.0                     # cota inferior del DN: bomba y juntas
    # DN del tubo: vacío = el más chico que cumple el Δp (sería DN40). En horquillas el
    # tubo sube 2 % de su largo, así que el largo es altura: DN50 queda en 66 m y 1,3 m
    # de desnivel (DN40: 114 m y 2,3 m), a cambio de pedir 10,6 m³/h de CIP en vez de 6,1.
    # Decisión del 10/11: DN50.
    DN_fijo: 50
    # El Δp de la yema es proporcional a su K, y K es incierto: la ecuación y la
    # tabla de [gut2003yolk] difieren 23–38 % sobre 48 °C. Se pide que entre con 1,4×.
    factor_seguridad_dp: 1.4
    v_CIP_min_m_s: 1.5                  # velocidad de limpieza en cañería [tamime2008cip]

control:
  # El controlador apunta un poco arriba de la T legal: oscila unas décimas y
  # la válvula de desvío, una vez que desvía, recién vuelve a dejar pasar al
  # menos 0,25 °C más arriba [cfia2026htst]. Sin margen, desviaría a cada rato.
  margen_sobre_T_legal_C: 0.5           # supuesto: el doble de esa histéresis

servicios:
  agua_caliente:
    DT_C: 4                             # salto del agua en calentamiento

criterios:
  Re_critico: 2100                      # fin del laminar en cañería
  Re_turbulento: 4000                   # entre ambos: transición; se usa el factor laminar (conservador)
  factor_turbulento_vmax: 1.25          # v_max/v_media en turbulento (supuesto)
  logs_objetivo: 5                      # criterio de desempeño [fsis2020rule]
