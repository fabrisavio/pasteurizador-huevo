# =============================================================================
# Configuración base del pasteurizador (v0.4)
#
# Unidades prácticas acá (kg/h, °C, min, bar). El código pasa todo a SI al
# cargar, salvo las temperaturas, que quedan en °C porque así están escritas
# todas las correlaciones de propiedades. Las diferencias de T valen igual en K.
#
# Entre corchetes, la clave de la fuente en docs/fuentes.bib.
#
# Para probar otro caso: copiá este archivo (por ejemplo a config/mi_caso.yaml),
# cambiá lo que quieras y corré  python correr.py config/mi_caso.yaml
# YAML: la sangría (espacios, no tabs) define qué está adentro de qué.
# =============================================================================

productos:

  HP:                                   # huevo entero
    nombre: Huevo entero
    caudal_kg_h: 798                    # balance de masa del grupo (RESUMEN.xlsx)
    T_entrada_C: 10                     # diseño; rango de operación 10–25 °C
    T_entrada_rango_C: [10, 25]
    T_holding_C: 60.0                   # safe harbor [fsis2026guideline], [rbn1994cap15]
    t_holding_min: 3.5
    T_salida_C: 45                      # salida al secador; más frío se acepta (31/10)
    T_max_agua_C: 63                    # tope de T de pared en calentamiento
    composicion:                        # fracción másica; balance del grupo, Tabla 2
      agua: 0.7651
      proteina: 0.126
      grasa: 0.100
      carbohidratos: 0.003
      cenizas: 0.0059
    termicas: choi_okos                 # [choi1986thermal]
    reologia: leon_munguia_huevo_entero # [leonmunguia_tesis]
    cinetica: {D_ref_min: 1.25, T_ref_C: 60.0, z_C: 4.84}   # derivado de [fsis2026guideline], Ap. III
    horas_anio: 2496

  YP:                                   # yema
    nombre: Yema
    caudal_kg_h: 1083
    T_entrada_C: 7                      # tanque a 7 °C [fsis2026guideline]
    T_entrada_rango_C: [7, 7.2]
    T_holding_C: 61.1                   # safe harbor [fsis2026guideline]
    t_holding_min: 3.5
    T_salida_C: 45
    T_max_agua_C: 64
    composicion:                        # yema comercial, USDA vía [froning2002manual], Tabla 1
      agua: 0.562
      proteina: 0.155
      grasa: 0.256
      carbohidratos: 0.0115
      cenizas: 0.0155
    termicas: choi_okos                 # alternativa: gut2003_yema (medidas; cp ~17 % menor)
    reologia: gut2003_yema              # tablas 4 y 5 de [gut2003yolk]
    cinetica: {D_ref_min: 1.68, T_ref_C: 61.1, z_C: 7.31}   # derivado de [fsis2026guideline], Ap. III
    horas_anio: 168

  CP:                                   # clara concentrada por UF (23 % de sólidos)
    nombre: Clara concentrada
    caudal_kg_h: 822.4
    T_entrada_C: 35                     # salida de la UF (dato SANOVO)
    T_entrada_rango_C: [35, 35]
    # 60 °C es posible porque la clara se estabiliza antes de pasteurizar:
    # ácido láctico hasta pH ~7 y sal de aluminio, que forma un complejo
    # termoestable con la ovotransferrina, la proteína más sensible
    # [cunningham1965stabilizing], [lineweaver1966patent], [froning2002manual].
    # Así soporta 60–61,7 °C durante 3,5–4 min sin coagular. [rbn1994cap15] 15.2.11, con alumbre
    T_holding_C: 60.0
    t_holding_min: 3.5
    T_salida_C: 45
    T_max_agua_C: 62
    composicion:
      agua: 0.77
      proteina: 0.203
      grasa: 0.0006
      carbohidratos: 0.0148
      cenizas: 0.0116
    termicas: choi_okos
    reologia: clara_uf_thapon_scalzo    # 9,3 mPa·s a 30 °C [thapon1981]; forma μ(T) de [scalzo1970viscosity]
    cinetica: {D_ref_min: 0.136, T_ref_C: 60.0, z_C: 2.62}  # pH 7,8 [fsis2026guideline]; a pH 7 es extrapolación
    horas_anio: 216

equipo:
  placa:                                # placa chevron "típica", dentro de rangos de libro
    area_m2: 0.15                       # [shah2003fundamentals], [kakac2012heat]
    ancho_m: 0.20                       # sin uso en v0
    separacion_b_m: 0.003               # sin uso en v0
    angulo_chevron_grados: 45           # sin uso en v0
    factor_area: 1.17                   # sin uso en v0
    espesor_m: 0.0005                   # sin uso en v0
    k_W_mK: 16.3                        # AISI 316L; sin uso en v0

  # v0: U fijo por sección, tomado del caso de yema de [gut2003yolk], Tabla 7
  # (contracorriente pura). En v1 se reemplaza por correlaciones de h.
  U_fijo_W_m2K:
    regeneracion: 756
    calentamiento: 864

  holding:
    DN_diam_int_m: {25: 0.026, 32: 0.032, 40: 0.038, 50: 0.050, 65: 0.066}   # [din11850], serie 2
    DN_diam_ext_m: {25: 0.029, 32: 0.035, 40: 0.041, 50: 0.053, 65: 0.070}
    geometria:
      tipo: espiral                     # espiral | recto. Con ~100 m nadie lo instala recto
      diam_espiral_m: 1.0               # diámetro de la hélice, al eje del tubo (supuesto)
      separacion_vueltas_m: 0.01        # luz entre vueltas
      # Partícula más rápida en la hélice, como fracción del tiempo medio.
      # Recto laminar newtoniano: 0,5. Hélice: 0,586–0,658 en el análisis de
      # flujo laminar ideal [ruthven1971helical], [trivedi1974rtd], según
      # [gutierrez2010holding], que midieron ≥ 0,70 en un tubo helicoidal real.
      # Se toma el extremo bajo (el conservador): v_max/v_media = 1/0,586 = 1,71.
      # Es un valor newtoniano; se aplica también a yema y huevo entero, cuyo
      # perfil ya es más plano que la parábola.
      t_min_sobre_t_medio: 0.586
      Dean_min: 11.6                    # debajo de esto no hay vórtices de Dean [white1929curved]: factor de tubo recto
    # La pérdida de T en el tubo se calcula con la aislación (antes era 0,5 °C fijo).
    # Para volver a un valor fijo: borrar 'aislacion' y poner  perdida_T_C: 0.5
    aislacion:
      forma: bloque                     # bloque: la espiral entera en una camisa desmontable | tubo: coquilla a lo largo
      espesor_m: 0.05
      k_W_mK: 0.040                     # lana mineral; mantas de fibra 0,038–0,046 [incropera2007fundamentals], Tabla A.3
      h_ext_W_m2K: 10                   # convección natural + radiación (supuesto; casi no influye)
      T_ambiente_C: 20                  # sala de proceso (supuesto)
      holgura_m: 0.05                   # luz entre la espiral y la camisa
      # La aislación del tubo de retención tiene que poder sacarse para inspeccionarlo [cfia2026htst]
    dp_max_bar: 1.0                     # cota inferior del DN: bomba y juntas
    # El Δp de la yema es proporcional a su K, y K es incierto: la ecuación y la
    # tabla de [gut2003yolk] difieren 23–38 % sobre 48 °C. Se pide que entre con 1,4×.
    factor_seguridad_dp: 1.4
    v_CIP_min_m_s: 1.5                  # velocidad de limpieza en cañería [tamime2008cip]

control:
  # El controlador apunta un poco arriba de la T legal: oscila unas décimas y
  # la válvula de desvío, una vez que desvía, recién vuelve a dejar pasar al
  # menos 0,25 °C más arriba [cfia2026htst]. Sin margen, desviaría a cada rato.
  margen_sobre_T_legal_C: 0.5           # supuesto: el doble de esa histéresis

servicios:
  agua_caliente:
    DT_C: 4                             # salto del agua en calentamiento

criterios:
  Re_critico: 2100                      # fin del laminar en cañería
  Re_turbulento: 4000                   # entre ambos: transición; se usa el factor laminar (conservador)
  factor_turbulento_vmax: 1.25          # v_max/v_media en turbulento (supuesto)
  logs_objetivo: 5                      # criterio de desempeño [fsis2020rule]
